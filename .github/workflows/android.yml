name: Android

# La CI est le compilateur de référence de ce dépôt : le SDK Android et les dépôts Maven ne
# sont pas joignables depuis l'environnement où ce code est écrit, donc rien n'est réputé
# compiler tant que ce workflow n'est pas vert.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Nécessaire uniquement pour publier la release sur un tag ; le reste du temps le
      # workflow ne fait que lire.
      contents: write
    env:
      # Au niveau du job, parce que le `if` d'une étape est évalué avant son propre `env`.
      # Vide sur une pull request venue d'un fork, où les secrets ne sont pas exposés : le
      # build de release sort alors non signé, ce qui est le comportement voulu.
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests du domaine
        run: ./gradlew :domain:test --no-daemon

      # ─── Version ──────────────────────────────────────────────────────────────────────
      # Sur un tag, c'est lui qui fait foi ; ailleurs on garde la version du build avec le
      # numéro d'exécution, pour que deux APK de développement restent distinguables.
      # `versionCode` suit le numéro d'exécution : Android exige qu'il croisse d'une mise à
      # jour à l'autre, et c'est la seule valeur monotone dont on dispose à coup sûr.
      - name: Déterminer la version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            RELEASE=true
          else
            NAME="0.1.0-build.${GITHUB_RUN_NUMBER}"
            RELEASE=false
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Version ${NAME} (code ${GITHUB_RUN_NUMBER}), release=${RELEASE}"

      # ─── Signature ────────────────────────────────────────────────────────────────────
      # Le keystore n'est pas dans le dépôt, qui est public : il arrive par un secret, et le
      # fichier déposé ici vit le temps du job. Sans le secret, l'étape est sautée et le
      # build de release sort non signé — utile pour une pull request, inutilisable tel quel.
      - name: Déposer le keystore
        id: keystore
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          KS="${RUNNER_TEMP}/sideload.jks"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KS"

          # Contrôle immédiat plutôt qu'un échec deux minutes plus tard dans l'empaquetage :
          # le message d'AGP à ce moment-là est trompeur (« Password is not ASCII » pour un
          # simple retour à la ligne resté collé au secret). Les `tr -d` retirent ce que la
          # copie d'un secret traîne derrière elle.
          PASS=$(printf '%s' "$SIGNING_KEYSTORE_PASSWORD" | tr -d '\r\n')
          ALIAS=$(printf '%s' "$SIGNING_KEY_ALIAS" | tr -d '\r\n')
          if ! keytool -list -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::Le keystore ne s'ouvre pas avec SIGNING_KEYSTORE_PASSWORD / SIGNING_KEY_ALIAS."
            echo "::error::Vérifie les secrets — un retour à la ligne collé à la valeur suffit à tout casser."
            exit 1
          fi
          echo "Keystore vérifié, alias présent."
          echo "path=${KS}" >> "$GITHUB_OUTPUT"

      - name: APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PygoVersionName=${{ steps.version.outputs.name }} \
            -PygoVersionCode=${{ steps.version.outputs.code }}
          mv app/build/outputs/apk/release/app-release*.apk \
             "ygo-deckbuilder-${{ steps.version.outputs.name }}.apk"

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: ygo-deckbuilder-${{ steps.version.outputs.name }}
          path: ygo-deckbuilder-*.apk
          if-no-files-found: error
          retention-days: 30

      # ─── Release ──────────────────────────────────────────────────────────────────────
      # Seulement sur un tag. `gh` est déjà sur le runner, donc pas d'action tierce à qui
      # confier un jeton d'écriture sur un dépôt public.
      - name: Release GitHub
        if: ${{ steps.version.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Préversion tant qu'on est en 0.x, release pleine ensuite.
          case "${{ steps.version.outputs.name }}" in
            0.*) FLAG=--prerelease ;;
            *)   FLAG= ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            "ygo-deckbuilder-${{ steps.version.outputs.name }}.apk" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes $FLAG

      - name: Publier les rapports de test en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-de-test
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
